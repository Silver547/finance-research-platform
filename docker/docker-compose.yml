version: "3.9"

services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - ../:/app
    command: streamlit run dashboard/Home.py --server.port=8501 --server.address=0.0.0.0

  # Optional: run the daily pipeline once via `docker compose run pipeline`
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../:/app
    entrypoint: python pipelines/orchestrator.py
