name: Weekly & Monthly Reports

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly: every Monday 03:00 UTC
    - cron: '0 4 1 * *'   # monthly: 1st of month 04:00 UTC
  workflow_dispatch:
    inputs:
      period:
        description: 'Report period to generate'
        required: true
        default: 'weekly'
        type: choice
        options: [weekly, monthly]

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
        run: |
          PERIOD="${{ github.event.inputs.period || 'weekly' }}"
          python agents/report_agent.py --period "$PERIOD"
